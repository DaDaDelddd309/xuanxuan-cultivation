# CI —— 工单 XX-QUAL-001
#
# 为什么现在需要它:
#   V0.98 之前,"9 项 lint 全绿" 这句话只在作者自己那台机器上成立。
#   更糟的是 —— 全绿的时候游戏是坏的:7 个 js/game/*.js 的相对路径写错,
#   整条 import 链断掉、main.js 都加载不了,而当时没有一个检查能看见。
#   原因不是检查写得不好,是**没有 CI**:回归只能靠人记得手动跑,
#   而人只跑自己那几个。
#
# 这里跑的东西与本地完全一致:npm run check = lint + test。
# 本仓库没有 lock 文件,所以用 npm install 而不是 npm ci;
# --ignore-scripts 是为了跳过 playwright 的浏览器下载(检查用不到,很大)。

name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 不装 devDependencies:lint 与单测都不依赖任何三方包
      - name: 安装
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: lint + test
        run: npm run check

      # sw.js 的预缓存清单里列了文件,但那些文件必须真的在仓库里。
      # lint-precache 只查"清单里有、磁盘没有";这条从另一个方向兜底:
      # 磁盘上有、清单里没有 → 离线白屏(V0.98 的 P0 就是这么漏出去的)。
      - name: 预缓存双向核对
        run: |
          node -e "
          const {readdirSync,readFileSync}=require('fs');
          const files=[];(function w(d){for(const e of readdirSync(d,{withFileTypes:true})){const p=d+'/'+e.name;
            if(e.isDirectory())w(p);else if(e.name.endsWith('.js'))files.push(p);}})('js');
          const sw=readFileSync('sw.js','utf8');
          const missing=files.filter(f=>!sw.includes(\"'\"+f+\"'\"));
          if(missing.length){console.error('❌ 磁盘有、预缓存清单没有(离线会白屏):');missing.forEach(m=>console.error('   '+m));process.exit(1);}
          console.log('✅ 全部 '+files.length+' 个模块都在预缓存清单里');
          "

  # 浏览器实测在本机跑不了(playwright 不支持 Android),放到 CI 上补。
  # 这一条是"看得见的"验收:灵伴有没有真的在场上动、主线因果句有没有真的弹出来。
  #
  # V0.98 已把这套测试里 24 个文件硬编码的 Chrome 路径 /workspace/.home/... 清掉了,
  # 现在它们用 playwright 自带的 chromium,换机器也能跑。
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true          # 先不卡主流程,跑通了再改成卡
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: 浏览器实测套件
        run: bash tests/run-browser.sh