# CI —— 工单 XX-QUAL-001
#
# 为什么现在需要它:
#   V0.98 之前,"9 项 lint 全绿" 这句话只在作者自己那台机器上成立。
#   更糟的是 —— 全绿的时候游戏是坏的:7 个 js/game/*.js 的相对路径写错,
#   整条 import 链断掉、main.js 都加载不了,而当时没有一个检查能看见。
#   原因不是检查写得不好,是**没有 CI**:回归只能靠人记得手动跑,
#   而人只跑自己那几个。
#
# 这里跑的东西与本地完全一致:npm run check = lint + test。
# 本仓库没有 lock 文件,所以用 npm install 而不是 npm ci;
# --ignore-scripts 是为了跳过 playwright 的浏览器下载(检查用不到,很大)。

name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 不装 devDependencies:lint 与单测都不依赖任何三方包
      - name: 安装
        run: npm install --ignore-scripts --no-audit --no-fund

      # 立绘调色板门禁(tools/art/measure_style.py)要 Pillow 才能采样。
      # ⚠️ 这条依赖以前**从来没在 CI 上装过** —— check job 根本没有 pip 步骤。
      #   于是 measure_style.py 每轮都以「缺依赖」退出码 2 结束,
      #   lint-portraits 走 skipNote 报「调色板本项未检查」, **整体照样 PASS**。
      #   也就是说:立绘明度/饱和度这道门禁在 CI 上**从来没有真正执行过**,
      #   而它在本地是真跑的 —— 正是本文件开头写的那个病(「全绿只在我机器上成立」)。
      - name: 安装 Python 采样依赖
        run: pip install --quiet pillow

      # 少依赖就**红**, 不许再悄悄降级成「未检查」。
      # 退出码:0=全部合规 / 1=有超标(由 lint-portraits 自己报,这里不重复判) / 2=缺依赖 / 其他=起不来
      - name: 确认采样器真的能跑(缺依赖即红)
        run: |
          set +e
          python3 tools/art/measure_style.py --gate > /dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error::measure_style.py 缺 Pillow —— 立绘调色板门禁没跑成。不接受把它降级成『未检查』后放绿。"
            exit 1
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::error::measure_style.py 非预期退出码 $code —— 采样器起不来,不是超标。"
            exit 1
          fi
          echo "采样器可用(退出码 $code)"

      - name: lint + test
        run: npm run check

      # sw.js 的预缓存清单里列了文件,但那些文件必须真的在仓库里。
      # lint-precache 只查"清单里有、磁盘没有";这条从另一个方向兜底:
      # 磁盘上有、清单里没有 → 离线白屏(V0.98 的 P0 就是这么漏出去的)。
      # 2026-10-11(XX-AUDIT-014):这段内联 node -e 已搬进
      # tests/lint-precache-reverse.mjs,并接进了 `npm run lint`。
      # 原来它**只活在 CI 里** —— 本地 `npm run check` 永远看不到它,
      # 结果它在 main 上连续红了三个提交(6b89551 / 0475e80 / 4dad804),
      # 红的原因是 js/xiuxian/world/{network,types}.js 漏进预缓存清单,
      # 而没有任何人在本地被告知过。
      # 「检查存在,但只存在于一个大多数人跑不到的地方」——
      # 和本工单原话「浏览器测试不在任何自动执行路径上」是同一个病,只是方向反了。
      # 现在两处调同一个文件,消除重复实现。
      - name: 预缓存双向核对
        run: node tests/lint-precache-reverse.mjs

  # 浏览器实测在本机跑不了(playwright 不支持 Android),放到 CI 上补。
  # 这一条是"看得见的"验收:灵伴有没有真的在场上动、主线因果句有没有真的弹出来。
  #
  # V0.98 已把这套测试里 24 个文件硬编码的 Chrome 路径 /workspace/.home/... 清掉了,
  # 现在它们用 playwright 自带的 chromium,换机器也能跑。
  #
  # 2026-10-10:去掉了 continue-on-error:true(原注释「先不卡主流程,跑通了再改成卡」)。
  # 留着它等于这套验收只能"看见红"却不会"挡住坏" —— 而它守的正是逻辑层抓不到的那一类
  # (重复定义互相覆盖、定义了没人调用、白屏、点了没反应)。
  # 现在它和 check job 一样是硬门禁。
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      # pillow 是 tools/visual/audit.py 的硬依赖(见下面「视觉巡检」那步)。
      # 以前这里只装 playwright, 于是 audit.py 每次都 ModuleNotFoundError 崩掉 ——
      # 而那步用 `|| true` 吞了退出码, 还无条件打印「视觉巡检完成」,
      # 于是 XX-VISUAL-001 的报告**从来没在 CI 上产出过**, 而日志说它完成了。
      - run: pip install playwright pillow
      - run: python -m playwright install --with-deps chromium
      - name: 浏览器实测套件
        run: bash tests/run-browser.sh
      # 视觉巡检(XX-VISUAL-001):tools/visual/audit.py 扫字体缺失/裁切/溢出/
      # 过小字号/对比度。之前它**从来没在 CI 上跑过** —— 而手机没有 chromium,
      # 所以这些维度在整轮开发里等于完全没测过(区域框叠成一团就是这么漏掉的)。
      #
      # ⚠️ 这里**故意不加 --strict**。已知存量约 199 处对比度命中,一开就是天天红,
      #   而红了就会被无视 —— 比不测更坏。先只**产出数据**(JSON 存进 artifact),
      #   等基线录出来再升级成硬门禁。判据取自被测对象本身,不许拍脑袋设阈值。
      #
      # ⚠️ 但「不卡门禁」≠「可以谎报跑成了」(XX-AUDIT-038)。
      #   原写法是 `audit.py ... || true` 之后**无条件** echo「视觉巡检完成」,
      #   于是脚本崩了、日志照样说完成、artifact 照样上传(内容是空的)。
      #   现在按真实退出码分两种说法:跑成了才说完成,没跑成就 ::warning 明说。
      - name: 视觉巡检(只报告,不卡门禁)
        run: |
          python3 -m http.server 8899 --bind 127.0.0.1 >/dev/null 2>&1 &
          SRV=$!
          sleep 2
          set +e
          python3 tools/visual/audit.py --port 8899 --json visual-report.json
          vc=$?
          set -e
          if [ "$vc" -ne 0 ]; then
            echo "::warning::视觉巡检没跑成(退出码 $vc),报告多半是空的。上面刻意不卡门禁,但这**不等于通过**。"
          else
            echo "--- 视觉巡检完成(报告见 artifact,暂不卡门禁) ---"
          fi
          kill $SRV 2>/dev/null || true
      - name: 上传视觉巡检报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: visual-report.json
          if-no-files-found: ignore